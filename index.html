<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluencyFlow - 3D 粒子画廊轮播秀</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Background decorative ambient lights -->
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>

        <!-- Header Section -->
        <header class="app-header">
            <div class="logo-area">
                <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
                <span class="logo-text">FluencyFlow</span>
                <span class="logo-tag">粒子画廊</span>
            </div>
            <div class="header-right">
                <div class="date-display" id="current-date">May 30, 2026</div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Left Panel: 3D Visualizer -->
            <section class="visualizer-section">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-cube"></i> 记忆映像</span>
                    <span class="panel-subtitle">3D 粒子重构交互</span>
                </div>
                
                <div class="canvas-container tech-corners">
                    <div class="tech-corners-inner"></div>
                    <canvas id="particle-canvas"></canvas>
                    
                    <!-- File Drag & Drop Upload Overlay -->
                    <div class="upload-overlay" id="upload-zone">
                        <div class="upload-content">
                            <div class="upload-icon-wrapper">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                            </div>
                            <h3>置入轮播素材</h3>
                            <p>拖拽或点击上传多张照片，重构为粒子进行宇宙轮播秀</p>
                            <input type="file" id="image-input" accept="image/*" multiple style="display: none;">
                            <button class="primary-btn upload-btn" onclick="document.getElementById('image-input').click()">
                                上传多张图片
                            </button>
                        </div>
                    </div>

                    <!-- Canvas settings sliders -->
                    <div class="canvas-overlay-sliders" id="canvas-sliders">
                        <div class="slider-row">
                            <span><i class="fa-solid fa-circle-dot"></i> 粒子大小</span>
                            <input type="range" id="slider-particle-size" min="0.4" max="2.5" step="0.1" value="0.9">
                        </div>
                    </div>

                    <!-- Canvas controls -->
                    <div class="canvas-controls">
                        <button class="control-btn" id="btn-spin" title="自动旋转开关">
                            <i class="fa-solid fa-arrows-spin spinning"></i>
                        </button>
                        <button class="control-btn" id="btn-reset-view" title="重置视角">
                            <i class="fa-solid fa-arrows-to-eye"></i>
                        </button>
                        <button class="control-btn" id="btn-disperse" title="粒子离散测试">
                            <i class="fa-solid fa-wind"></i>
                        </button>
                        <button class="control-btn" id="btn-fullscreen" title="全屏展示">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                        <div class="particle-count-tag" id="particle-count">Particles: 0</div>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Carousel Control Center -->
            <section class="interaction-section">
                <div class="carousel-control-center tech-corners">
                    <div class="tech-corners-inner"></div>
                    <div class="panel-header">
                        <span class="panel-title"><i class="fa-solid fa-play-pause"></i> 轮播控制台</span>
                        <span class="panel-subtitle">Carousel Control Center</span>
                    </div>

                    <!-- Carousel Action Bar -->
                    <div class="carousel-actions-bar">
                        <button class="gradient-btn" id="btn-toggle-play" title="播放/暂停自动轮播">
                            <i class="fa-solid fa-play" id="btn-play-icon"></i> <span id="btn-play-text">自动播放</span>
                        </button>
                        <div class="manual-controls">
                            <button class="control-btn-small" id="btn-prev-image" title="上一张">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button class="control-btn-small" id="btn-next-image" title="下一张">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Slider Configuration Parameters -->
                    <div class="carousel-settings-group">
                        <div class="setting-row-small">
                            <span><i class="fa-regular fa-clock"></i> 原图展示时间</span>
                            <div class="slider-val-wrapper">
                                <input type="range" id="slider-image-time" min="2" max="15" step="1" value="4">
                                <span id="val-image-time">4s</span>
                            </div>
                        </div>
                        <div class="setting-row-small">
                            <span><i class="fa-solid fa-rotate-left"></i> 粒子态展示时间</span>
                            <div class="slider-val-wrapper">
                                <input type="range" id="slider-particle-time" min="2" max="15" step="1" value="5">
                                <span id="val-particle-time">5s</span>
                            </div>
                        </div>
                        <div class="setting-row-small">
                            <span><i class="fa-solid fa-wand-magic-sparkles"></i> 渐变过渡时间</span>
                            <div class="slider-val-wrapper">
                                <input type="range" id="slider-fade-time" min="0.5" max="4.0" step="0.5" value="1.5">
                                <span id="val-fade-time">1.5s</span>
                            </div>
                        </div>
                    </div>

                    <!-- Image List Section -->
                    <div class="image-list-section">
                        <div class="section-title">
                            <span><i class="fa-regular fa-images"></i> 轮播画册列表</span>
                            <span class="badge" id="image-count">0 张</span>
                        </div>
                        <div class="image-upload-trigger-row">
                            <button class="outline-btn-small" onclick="document.getElementById('image-input').click()">
                                <i class="fa-solid fa-plus"></i> 添加更多图片
                            </button>
                        </div>
                        <div class="carousel-image-list" id="carousel-image-list">
                            <!-- Image card items will be rendered dynamically -->
                            <div class="no-images-placeholder" id="no-images-placeholder">
                                <i class="fa-regular fa-image"></i>
                                <p>尚未添加轮播图片</p>
                                <small>请在左侧区域或上方按钮上传素材</small>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Core App Scripts -->
    <script src="particles.js"></script>
    <script src="app.js"></script>
</body>
</html>
